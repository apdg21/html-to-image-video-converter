<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative #11 — Flash Sale</title>
<style>
body{margin:0;background:#0a0a0a}
.creative{width:1200px;height:630px;position:relative;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#ff7a45,#7a3cff);font-family:Arial,sans-serif;color:#fff;text-align:center}
h1{font-size:108px;margin:0;animation:pop 2s ease-in-out infinite alternate}
p{font-size:34px;margin-top:16px;animation:fade 2s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(.8) rotate(-4deg)}to{transform:scale(1.1) rotate(4deg)}}
@keyframes fade{from{opacity:.2}to{opacity:1}}
</style>
</head>
<body>
<div class="creative"><div><h1>MEGA SALE</h1><p>Up to 50% off this week</p></div></div>
</body>
</html>
