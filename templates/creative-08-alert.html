<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative #8 — Notification Alert</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Inter', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  .creative {
    width: 1200px; max-width: 100%; aspect-ratio: 1200/630;
    background: #0f172a; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 40px;
    border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .pulse-ring {
    position: absolute; width: 200px; height: 200px;
    border-radius: 50%; border: 2px solid rgba(56,189,248,0.2);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    animation: c8PulseRing 2s ease-out infinite;
  }
  .pulse-ring:nth-child(2) { animation-delay: 0.4s; }
  .pulse-ring:nth-child(3) { animation-delay: 0.8s; }
  @keyframes c8PulseRing { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }

  .icon-wrap {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; animation: iconPop 0.6s ease-out both;
    position: relative; z-index: 2; margin-bottom: 24px;
  }
  @keyframes iconPop { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.1) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }

  .title { color: #f8fafc; font-size: 44px; font-weight: 800; text-align: center; line-height: 1.1; animation: fadeInUp 0.6s ease-out 0.3s both; position: relative; z-index: 2; }
  @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .subtitle { color: #94a3b8; font-size: 18px; text-align: center; margin-top: 12px; animation: fadeInUp 0.6s ease-out 0.5s both; position: relative; z-index: 2; }

  .bar { width: 100%; max-width: 500px; height: 4px; background: rgba(30,41,59,0.8); border-radius: 2px; margin-top: 28px; overflow: hidden; animation: fadeInUp 0.6s ease-out 0.7s both; position: relative; z-index: 2; }
  .bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #38bdf8, #818cf8); animation: barFill 3s ease-out infinite; }
  @keyframes barFill { 0% { width: 0%; } 30% { width: 100%; } 80% { width: 100%; } 100% { width: 0%; } }
</style>
</head>
<body>
<div class="creative">
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="icon-wrap">🎉</div>
  <div class="title">10,000 Resumes<br>Built This Month!</div>
  <div class="subtitle">Join the fastest-growing resume builder community</div>
  <div class="bar"><div class="bar-fill"></div></div>
</div>
</body>
</html>
