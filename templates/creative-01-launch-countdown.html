<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative #1 — Launch Countdown</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .creative {
    width: 1200px;
    max-width: 100%;
    aspect-ratio: 1200/630;
    background: #0f172a;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .bg-particles { position: absolute; inset: 0; overflow: hidden; }
  .particle {
    position: absolute; width: 3px; height: 3px;
    border-radius: 50%; background: rgba(56,189,248,0.4);
    animation: floatParticle linear infinite;
  }
  .particle:nth-child(1) { left: 10%; top: 20%; animation-duration: 4s; animation-delay: 0s; }
  .particle:nth-child(2) { left: 80%; top: 60%; animation-duration: 5s; animation-delay: 1s; }
  .particle:nth-child(3) { left: 30%; top: 80%; animation-duration: 3.5s; animation-delay: 2s; }
  .particle:nth-child(4) { left: 70%; top: 15%; animation-duration: 4.5s; animation-delay: 0.5s; }
  .particle:nth-child(5) { left: 50%; top: 50%; animation-duration: 5.5s; animation-delay: 1.5s; }
  .particle:nth-child(6) { left: 20%; top: 70%; animation-duration: 3.8s; animation-delay: 2.5s; }
  .particle:nth-child(7) { left: 90%; top: 30%; animation-duration: 4.2s; animation-delay: 0.8s; }
  .particle:nth-child(8) { left: 60%; top: 85%; animation-duration: 5.2s; animation-delay: 1.2s; }

  @keyframes floatParticle {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-200px) scale(0.5); opacity: 0; }
  }

  .glow {
    position: absolute; width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%);
    animation: pulseGlow 3s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.15); opacity: 0.8; }
  }

  .badge {
    position: relative; z-index: 2;
    background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(129,140,248,0.2));
    border: 1px solid rgba(56,189,248,0.3);
    border-radius: 50px; padding: 6px 20px;
    color: #38bdf8; font-size: 13px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    animation: slideDown 0.8s ease-out both;
    margin-bottom: 20px;
  }

  .main-text { position: relative; z-index: 2; text-align: center; animation: fadeInUp 1s ease-out 0.3s both; }
  .main-text h2 {
    font-size: 72px; font-weight: 900; color: #f8fafc;
    line-height: 1; letter-spacing: -3px;
  }
  .main-text h2 .highlight {
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .sub {
    position: relative; z-index: 2;
    color: #94a3b8; font-size: 20px; font-weight: 400;
    margin-top: 12px; animation: fadeInUp 1s ease-out 0.6s both;
  }

  .countdown {
    position: relative; z-index: 2;
    display: flex; gap: 16px; margin-top: 28px;
    animation: fadeInUp 1s ease-out 0.9s both;
  }
  .clock-unit {
    background: rgba(30,41,59,0.8); border: 1px solid rgba(56,189,248,0.2);
    border-radius: 12px; padding: 12px 20px;
    text-align: center; min-width: 80px; backdrop-filter: blur(10px);
  }
  .clock-num { font-size: 36px; font-weight: 800; color: #f8fafc; line-height: 1; }
  .clock-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .cta {
    position: relative; z-index: 2; margin-top: 24px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    color: #0f172a; font-size: 16px; font-weight: 700;
    padding: 14px 40px; border-radius: 50px;
    animation: fadeInUp 1s ease-out 1.2s both;
  }

  @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>

<div class="creative">
  <div class="bg-particles">
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>
  <div class="glow"></div>
  <div class="badge">🚀 Coming Soon</div>
  <div class="main-text">
    <h2>The Future of <span class="highlight">Resumes</span><br>Is Here</h2>
  </div>
  <div class="sub">AI-powered resume builder that gets you hired</div>
  <div class="countdown">
    <div class="clock-unit"><div class="clock-num">03</div><div class="clock-label">Days</div></div>
    <div class="clock-unit"><div class="clock-num">12</div><div class="clock-label">Hours</div></div>
    <div class="clock-unit"><div class="clock-num">45</div><div class="clock-label">Mins</div></div>
    <div class="clock-unit"><div class="clock-num">30</div><div class="clock-label">Secs</div></div>
  </div>
  <div class="cta">Get Early Access →</div>
</div>

</body>
</html>
