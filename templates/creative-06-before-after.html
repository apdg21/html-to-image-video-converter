<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative #6 — Before / After</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Inter', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  .creative {
    width: 1200px; max-width: 100%; aspect-ratio: 1200/630;
    background: #0f172a; position: relative; overflow: hidden;
    display: flex; align-items: center; padding: 40px; gap: 24px;
    border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .divider {
    position: absolute; left: 50%; top: 10%; height: 80%; width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(56,189,248,0.3), transparent);
    z-index: 5; animation: dividerReveal 1s ease-out 0.5s both;
  }
  @keyframes dividerReveal { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

  .panel { flex: 1; position: relative; z-index: 2; }
  .panel-bg { border-radius: 16px; background: rgba(30,41,59,0.4); padding: 24px; }
  .panel-left .panel-bg { border: 1px solid rgba(239,68,68,0.15); animation: panelReveal 0.8s ease-out 0.3s both; }
  .panel-right .panel-bg { border: 1px solid rgba(52,211,153,0.3); animation: panelReveal 0.8s ease-out 0.6s both; }
  @keyframes panelReveal { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .panel-label { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
  .panel-left .panel-label { color: #f87171; }
  .panel-right .panel-label { color: #34d399; }

  .panel-lines { display: flex; flex-direction: column; gap: 8px; }
  .line { height: 8px; border-radius: 4px; animation: lineGrow ease-out both; }
  .panel-left .line { background: rgba(239,68,68,0.2); }
  .panel-right .line { background: rgba(52,211,153,0.2); }

  .panel-left .line:nth-child(1) { width: 70%; animation-duration: 0.8s; animation-delay: 0.5s; }
  .panel-left .line:nth-child(2) { width: 50%; animation-duration: 0.8s; animation-delay: 0.6s; }
  .panel-left .line:nth-child(3) { width: 60%; animation-duration: 0.8s; animation-delay: 0.7s; }
  .panel-left .line:nth-child(4) { width: 40%; animation-duration: 0.8s; animation-delay: 0.8s; }

  .panel-right .line:nth-child(1) { width: 95%; animation-duration: 0.8s; animation-delay: 0.8s; }
  .panel-right .line:nth-child(2) { width: 90%; animation-duration: 0.8s; animation-delay: 0.9s; }
  .panel-right .line:nth-child(3) { width: 88%; animation-duration: 0.8s; animation-delay: 1.0s; }
  .panel-right .line:nth-child(4) { width: 92%; animation-duration: 0.8s; animation-delay: 1.1s; }

  @keyframes lineGrow { from { transform: scaleX(0); transform-origin: left; } to { transform: scaleX(1); transform-origin: left; } }

  .center-text { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10; text-align: center; }
  .vs { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0f172a; font-size: 18px; font-weight: 900; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; animation: vsBounce 0.6s ease-out 0.4s both; }
  @keyframes vsBounce { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.2) rotate(10deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
</style>
</head>
<body>
<div class="creative">
  <div class="panel panel-left">
    <div class="panel-bg">
      <div class="panel-label">Before</div>
      <div class="panel-lines">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      </div>
    </div>
  </div>
  <div class="center-text">
    <div class="vs">VS</div>
  </div>
  <div class="divider"></div>
  <div class="panel panel-right">
    <div class="panel-bg">
      <div class="panel-label">After</div>
      <div class="panel-lines">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
