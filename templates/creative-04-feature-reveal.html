<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative #4 — Feature Reveal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Inter', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  .creative {
    width: 1200px; max-width: 100%; aspect-ratio: 1200/630;
    background: #0f172a; position: relative; overflow: hidden;
    display: flex; align-items: center; padding: 48px; gap: 40px;
    border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .left { flex: 1; position: relative; z-index: 2; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.2);
    border-radius: 50px; padding: 5px 14px;
    color: #38bdf8; font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    animation: chipSlide 0.6s ease-out both;
  }
  @keyframes chipSlide { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .heading { font-size: 56px; font-weight: 800; color: #f8fafc; line-height: 1.1; margin-top: 16px; letter-spacing: -1.5px; animation: textReveal 0.8s ease-out 0.2s both; }
  .heading .accent { background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  @keyframes textReveal { from { transform: translateY(25px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .bullets { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .bullet { display: flex; align-items: center; gap: 10px; color: #94a3b8; font-size: 16px; animation: bulletSlide 0.6s ease-out both; }
  .bullet:nth-child(1) { animation-delay: 0.4s; }
  .bullet:nth-child(2) { animation-delay: 0.55s; }
  .bullet:nth-child(3) { animation-delay: 0.7s; }
  @keyframes bulletSlide { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .check { width: 22px; height: 22px; border-radius: 50%; background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.3); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #38bdf8; flex-shrink: 0; }

  .right { width: 380px; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }

  .card-stack { position: relative; width: 320px; height: 220px; }
  .card {
    position: absolute;
    background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; backdrop-filter: blur(10px); padding: 20px;
    animation: cardFloat ease-in-out infinite;
  }
  .card:nth-child(1) { width: 280px; height: 80px; top: 0; left: 0; animation-duration: 3s; }
  .card:nth-child(2) { width: 280px; height: 80px; top: 70px; left: 40px; animation-duration: 3.5s; animation-delay: 0.3s; }
  .card:nth-child(3) { width: 280px; height: 80px; top: 140px; left: 0; animation-duration: 3.2s; animation-delay: 0.6s; }
  @keyframes cardFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(0.5deg); } }

  .card-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(129,140,248,0.2)); display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 8px; }
  .card-title { color: #f8fafc; font-size: 14px; font-weight: 600; }
  .card-sub { color: #64748b; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<div class="creative">
  <div class="left">
    <div class="chip">✦ New Feature</div>
    <div class="heading">AI-Powered<br><span class="accent">Smart</span><br>Formatting</div>
    <div class="bullets">
      <div class="bullet"><div class="check">✓</div><span>Auto-tailored to job descriptions</span></div>
      <div class="bullet"><div class="check">✓</div><span>Keyword optimization built-in</span></div>
      <div class="bullet"><div class="check">✓</div><span>One-click ATS-friendly export</span></div>
    </div>
  </div>
  <div class="right">
    <div class="card-stack">
      <div class="card">
        <div class="card-icon">📄</div>
        <div class="card-title">ATS Score</div>
        <div class="card-sub">98% compatible</div>
      </div>
      <div class="card">
        <div class="card-icon">🔍</div>
        <div class="card-title">Keywords</div>
        <div class="card-sub">12 matched</div>
      </div>
      <div class="card">
        <div class="card-icon">✅</div>
        <div class="card-title">Format</div>
        <div class="card-sub">Perfect layout</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
