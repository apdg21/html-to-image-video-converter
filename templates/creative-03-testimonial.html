<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative #3 — Testimonial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Inter', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  .creative {
    width: 1200px; max-width: 100%; aspect-ratio: 1200/630;
    background: #0f172a; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 40px;
    border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .stars { display: flex; gap: 4px; margin-bottom: 24px; animation: starsReveal 0.8s ease-out both; }
  .star { font-size: 28px; animation: starBounce 0.6s ease-out both; }
  .star:nth-child(1) { animation-delay: 0.1s; }
  .star:nth-child(2) { animation-delay: 0.2s; }
  .star:nth-child(3) { animation-delay: 0.3s; }
  .star:nth-child(4) { animation-delay: 0.4s; }
  .star:nth-child(5) { animation-delay: 0.5s; }

  @keyframes starsReveal { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes starBounce { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.2) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }

  .quote { max-width: 700px; text-align: center; position: relative; }
  .quote::before { content: '"'; position: absolute; top: -30px; left: -20px; font-size: 120px; color: rgba(56,189,248,0.1); font-family: Georgia, serif; line-height: 1; }
  .quote-text { font-size: 26px; color: #e2e8f0; line-height: 1.5; font-weight: 500; animation: quoteReveal 1s ease-out 0.3s both; }
  @keyframes quoteReveal { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .author { display: flex; align-items: center; gap: 14px; margin-top: 28px; animation: authorReveal 0.8s ease-out 0.8s both; }
  @keyframes authorReveal { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #38bdf8, #818cf8); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #0f172a; }
  .author-name { color: #f8fafc; font-size: 16px; font-weight: 700; }
  .author-role { color: #64748b; font-size: 13px; margin-top: 2px; }

  .logos { display: flex; gap: 32px; margin-top: 32px; opacity: 0.3; animation: logosReveal 1s ease-out 1.1s both; }
  @keyframes logosReveal { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 0.3; } }
  .logo-item { color: #94a3b8; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="creative">
  <div class="stars">
    <div class="star">⭐</div><div class="star">⭐</div>
    <div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div>
  </div>
  <div class="quote">
    <div class="quote-text">I went from sending 50 applications with zero callbacks to landing my dream job in just 2 weeks. The resume builder is a game changer.</div>
  </div>
  <div class="author">
    <div class="avatar">SK</div>
    <div>
      <div class="author-name">Sarah Kim</div>
      <div class="author-role">Senior Product Designer at Stripe</div>
    </div>
  </div>
  <div class="logos">
    <div class="logo-item">GOOGLE</div>
    <div class="logo-item">STRIPE</div>
    <div class="logo-item">NOTION</div>
    <div class="logo-item">SLACK</div>
  </div>
</div>
</body>
</html>
