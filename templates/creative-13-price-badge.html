<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative #13 — Price Badge</title>
<style>
body{margin:0;background:#0a0a0a}
.creative{width:1200px;height:630px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#1e293b,#090d16);color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.box{background:linear-gradient(180deg,#162438,#0d1624);border:2px solid #00d4ff;border-radius:24px;padding:48px 40px;box-shadow:0 0 45px rgba(0,212,255,.25);max-width:440px;width:100%;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 35px rgba(0,212,255,.2)}50%{box-shadow:0 0 60px rgba(0,212,255,.45)}}
.badge{background:#00d4ff;color:#090d16;font-size:12px;font-weight:800;padding:5px 14px;border-radius:99px;text-transform:uppercase;display:inline-block;margin-bottom:16px}
.price{font-size:64px;font-weight:900;color:#00d4ff;line-height:1;margin:12px 0 6px}
.sub{color:#94a3b8;font-size:16px;margin-bottom:24px}
.btn{background:#00d4ff;color:#090d16;font-weight:800;padding:14px 28px;border-radius:12px;display:inline-block}
</style>
</head>
<body>
<div class="creative"><div class="box"><span class="badge">Limited Offer</span><h2>Lifetime Unlock Key</h2><div class="price">$15</div><div class="sub">One-time payment · Zero subscriptions</div><div class="btn">Get Instant Access →</div></div></div>
</body>
</html>
